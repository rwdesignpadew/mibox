name: MiBoxScreen
options:
  bundleIdPrefix: pl.miboxscreen
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk.git
    from: 4.8.6
settings:
  base:
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MiBoxScreen:
    type: application
    platform: iOS
    sources:
      - path: MiBoxScreen
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.miboxscreen.ios
        INFOPLIST_FILE: MiBoxScreen/Info.plist
        CODE_SIGN_ENTITLEMENTS: MiBoxScreen/MiBoxScreen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: PY32XNF74N
          PROVISIONING_PROFILE_SPECIFIER: MiBox Screen App Store
    dependencies:
      - target: ScreenBroadcast
      - package: GoogleCast
        product: GoogleCastDynamic
    postCompileScripts: []
  ScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenBroadcast
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.miboxscreen.ios.broadcast
        INFOPLIST_FILE: ScreenBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenBroadcast/ScreenBroadcast.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: PY32XNF74N
          PROVISIONING_PROFILE_SPECIFIER: MiBox Screen Broadcast App Store
